<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 1240" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="orange" x1="210" y1="170" x2="800" y2="940" gradientUnits="userSpaceOnUse">
